name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build WASM and KanjiVG Bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain prerequisites
        run: |
          ./tools/setup_toolchain.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - name: Build KanjiVG database and Rust WASM package
        run: |
          make all
          make deploy DEPLOY_DIR=dist
      - name: Upload built web bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drawkanji-web-dist
          path: dist/
          if-no-files-found: error
