name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to create or update (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
        type: string
permissions:
  contents: read
jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install toolchain prerequisites
        run: |
          ./tools/setup_toolchain.sh
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
      - name: Build KanjiVG database and Rust WASM package
        run: |
          make clean
          make all
          make deploy DEPLOY_DIR=dist
      - name: Package release archives
        run: |
          mkdir -p release_assets
          (cd dist && zip -r ../release_assets/drawkanji-web-dist.zip .)
          tar -C dist -czf release_assets/drawkanji-web-dist.tar.gz .
          cp dist/kanjivg/kanjivg.bin release_assets/kanjivg.bin
          sha256sum release_assets/* > release_assets/SHA256SUMS.txt
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drawkanji-release-assets
          path: release_assets/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if [[ "${REF_TYPE}" == "tag" ]]; then
            RELEASE_TAG="${REF_NAME}"
          else
            RELEASE_TAG="${INPUT_TAG}"
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" release_assets/* --clobber
          else
            gh release create "${RELEASE_TAG}" release_assets/* \
              --target "${TARGET_SHA}" \
              --title "DrawKanji ${RELEASE_TAG}" \
              --generate-notes
          fi
